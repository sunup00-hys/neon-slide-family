const zone=ZONES[Math.max(0,Math.min(5,Math.floor((pos.z-15)/26)))];$('zone').innerHTML=pos.z<=8?'<b>나의 안전지대</b><small>부화 · 농장 · 러닝머신</small>':`<b>${zone.name}</b><small>추천 속도 ${zone.need} m/s · ${pos.z.toFixed(0)}m</small>`;const ev=eventAt(now()),ed=eggDef(ev.id);$('event').innerHTML=`<strong>${ed.icon} ${ed.name}</strong>${ev.active?'한정 알 출현 중':'다음 이벤트'} · ${seconds((ev.endsAt-now())/1000)}`;
let message='알을 찾아 모험을 떠나세요',detail='가까이 가서 집기 · 안전지대로 돌아오기',actionLabel='집기';if(d.training){message='러닝머신 훈련 중';detail='훈련·강화에서 종료하면 탐험할 수 있어요';actionLabel='훈련 중';}else if(r?.status==='caught'){message='어미에게 잡혔어요!';detail='다시 출발하면 안전지대에서 시작해요';actionLabel='재도전';}else if(r?.status==='delivered'){message=(inflight||inputs.length)?'귀환 성공! 서버에 저장 중…':'귀환 성공! 알이 안전하게 저장됐어요';detail='인벤토리에서 부화를 시작해 보세요';actionLabel='새 모험';}else if(r?.carry){message=eggDef(r.carry.eggId).name+'을 들고 달려요!';detail='안전지대까지 '+Math.max(0,Math.ceil(r.z-7))+'m · 어미가 쫓아오고 있어요';actionLabel='내려놓기';}else if(!r){message='훈련을 마쳤다면 새로운 모험을 시작하세요';detail='출발을 눌러 탐험을 시작해요';actionLabel='출발';}else if(r?.z<=7){message='안전지대 · 나만의 농장';detail='앞으로 달려서 목초지의 알을 가져오세요';actionLabel='알 보관함';}else{const n=nearest();if(n&&Math.hypot(n.x-r.x,n.z-r.z)<3.4){message=eggDef(n.eggId).name+'을 발견했어요';detail=n.size>1.4?'거대알! 생산량은 높지만 더 무거워요':'집으면 어미가 쫓아와요. 돌아갈 길을 확인하세요';}}
$('quest').classList.toggle('danger',!!r?.mother);if(message+'|'+detail!==lastMsg){lastMsg=message+'|'+detail;$('quest').innerHTML=message+'<small>'+detail+'</small>';$('interact').lastElementChild.textContent=actionLabel;}$('interact').disabled=busy||!ready;hud();drawMap(pos);renderer.render(scene,camera);}
function drawMap(pos){const c=$('minimap'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ZONES.forEach(z=>{ctx.fillStyle='#'+z.color.toString(16).padStart(6,'0');ctx.fillRect(35,319-(z.at+14)*1.7,158,43);});ctx.fillStyle='#acffd0';ctx.fillRect(35,306,158,32);ctx.fillStyle='#fded91';for(const n of nestsAt(now()).filter(n=>!d.claimedNests.includes(n.id))){ctx.beginPath();ctx.arc(114+n.x*4,319-n.z*1.7,3,0,Math.PI*2);ctx.fill();}ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.fillStyle='#ff734d';ctx.beginPath();ctx.arc(114+pos.x*4,319-pos.z*1.7,7,0,Math.PI*2);ctx.fill();ctx.stroke();}
setInterval(()=>{if(!d)return;for(const el of document.querySelectorAll('[data-countdown]')){const left=Number(el.dataset.countdown)-now();el.textContent=left<=0?'완료!':seconds(left/1000);if(left<=0&&el.closest('[data-hatch]')==null&&panel==='inventory'){const btn=el.closest('.card')?.querySelector('[data-hatch]');if(btn){btn.disabled=false;btn.textContent='펫 만나기';}}}if(panel==='farm'&&$('farmBank'))$('farmBank').textContent=fmt(d.farmBank+Math.max(0,Math.min(43200000,now()-d.farmAt))/1000*rate());if(d.training&&$('trainSpeed'))$('trainSpeed').textContent=speedFor(d.xp+Math.max(0,Math.min(d.training.until,now())-d.training.at)/1000*10*(d.treadmill+1)**1.6).toFixed(2)+' m/s';},500);
setInterval(()=>{if(ready&&!inflight&&!inputs.length&&!busy&&!practice)refresh();},15000);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});renderer.setSize(innerWidth,innerHeight,false);camera.position.set(0,25,30);load();requestAnimationFrame(animate);
