<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쥬도쿠 · NEON SLIDE FAMILY</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#553f39}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b4e6f9,#dcf6f2 65%,#d0e8a8);min-height:100vh}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #488ed7}.wrap{max-width:550px;margin:auto;padding:12px 12px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.nav{background:#fff9ea;color:#644b38;text-decoration:none;padding:10px 15px;border-radius:22px;font-weight:800;box-shadow:0 3px 0 #c9b4a0}.title{text-align:center;margin:7px 0 8px}.title h1{display:inline-block;margin:0;padding:5px 26px;border:5px solid #b87a35;border-radius:22px;background:linear-gradient(#fff1ad,#ffc45f);font-size:clamp(28px,8vw,41px);text-shadow:2px 2px #fff;box-shadow:0 6px #ab793e}.title small{display:block;margin:8px;font-weight:700}.mascots{display:flex;justify-content:space-around;font-size:38px;margin:4px 0}.stats{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:8px 0}.stats>span,.stats select{background:#fff9e8;border:2px solid #e0d4c2;border-radius:16px;padding:8px 11px;font-weight:800;box-shadow:0 2px #ccc4b5}.rules{display:grid;grid-template-columns:repeat(3,1fr);background:white;border-radius:18px;padding:13px 5px;margin:11px 0 15px;box-shadow:0 5px 11px #386b7522;text-align:center;font-weight:800;font-size:clamp(10px,2.75vw,14px)}.rules div+div{border-left:2px solid #dedbd9}.rules b{display:block;font-size:22px;margin-bottom:5px}.board{display:grid;gap:4px;padding:7px;background:#fff;border-radius:18px;box-shadow:0 6px 12px #37616930;touch-action:manipulation}.cell{border:0;aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:clamp(19px,6vw,41px);font-weight:900;color:white;text-shadow:0 2px 3px #0001;padding:0}.cell.marked{box-shadow:inset 0 0 0 3px #ea548e}.cell:active{transform:scale(.94)}.cell.locked{filter:saturate(.85)}.cell.err{outline:3px solid #ea4343;outline-offset:-3px}.modes{display:flex;gap:6px;margin:14px 0 8px}.modes button{flex:1;padding:11px 4px;border:2px solid #fff;border-radius:17px;background:#fffef5;font-weight:900;color:#655047}.modes button.active{background:#ffe596;border-color:#f4b738}.hintrow{display:flex;gap:8px;margin:12px 0}.hintrow button{border:3px solid #fff;border-radius:16px;padding:14px 7px;flex:1;font-weight:900;box-shadow:0 4px #0002}.hint{background:#ffdf66}.reset{background:#d9ceff}.next{background:#8fe05f}.message{text-align:center;font-size:22px;font-weight:900;min-height:35px;margin:12px 0 0}.small{text-align:center;font-size:12px;line-height:1.7;color:#665c5f}.lvlbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:15px 0}.lvlbar button{border:1px solid #fff;border-radius:8px;padding:7px 0;background:#fffcf0;font-size:12px;font-weight:800;color:#765945}.lvlbar button.done{background:#92e17e}.lvlbar button.current{outline:3px solid #edaa3b}.lvlbar button:disabled{opacity:.5}footer{text-align:center;margin-top:20px;font-size:11px;color:#5c6564}.note{background:#fffbe5;border:1px solid #e4c57c;border-radius:9px;padding:8px 12px;margin-top:12px;font-size:11px;text-align:center}
</style></head><body><main class="wrap"><div class="top"><a class="nav" href="./index.html">⌂ 홈</a><span>🐾 가족 퍼즐</span><a class="nav" href="./sudoku.html">▦ 스도쿠</a></div><div class="title"><h1>쥬도쿠 🐾</h1><small>Zoo 스토쿠 · 동물 논리 퍼즐</small></div><div class="mascots">🐶 🦊 🐰 🐼 🐻</div><div class="stats"><span id="levelTxt">레벨 1 / 20</span><span>⏱ <span id="clock">00:00</span></span><span id="progressTxt">★ 0/20</span></div><div class="rules"><div><b>🎨</b>색깔마다<br>동물 1마리</div><div><b>▦</b>각 행과 열에<br>1마리씩</div><div><b>🐾</b>동물끼리<br>닿지 않기</div></div><div id="board" class="board" aria-label="동물 논리 퍼즐"></div><div class="modes"><button id="xMode" class="active" onclick="mode='x';render()">✕ 제외 표시</button><button id="aMode" onclick="mode='animal';render()">🐶 동물 확정</button></div><div class="message" id="message" role="status">빈칸을 눌러 풀어보세요!</div><div class="hintrow"><button class="hint" onclick="hint()">💡 힌트</button><button class="reset" onclick="resetBoard()">↻ 다시하기</button><button class="next" onclick="nextLevel()">▶ 다음</button></div><div class="small">X는 정답이 아닌 칸에 표시하고, 동물 모드에서는 배치할 칸을 눌러주세요.<br>같은 칸을 다시 누르면 표시가 해제됩니다.</div><div class="lvlbar" id="levels"></div><div class="note">시범 버전: 20단계 논리 퍼즐과 조작 기능 구현. 기존 가족 서버의 별·사용자·순위 연동은 아직 적용 전입니다.</div><footer>NEON SLIDE · ZOODOKU PREVIEW</footer></main>
<script>
'use strict';
const colors=['#7ed9b9','#9dce65','#f5c75d','#9ac3e6','#bd9ee7','#ebaa73','#f5abc1','#8bdce1'];
const icons=['🐶','🦊','🐰','🐼','🐻','🐱','🐸','🐨'];
const $=id=>document.getElementById(id);
let mode='x',level=1,game=null,marks=[],ticks=0,completed=new Set(),clockHandle=null,win=false;
const randFactory=seed=>()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
function shuffle(arr,rng){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function solutions(n,regions,fixed,notAllowed,limit=2){let count=0,first=null;const positions=[],usedCols=new Set(),usedRegions=new Set();function visit(r){if(count>=limit)return;if(r===n){count++;first??=positions.slice();return}for(let c=0;c<n;c++){const zone=regions[r*n+c];if(usedCols.has(c)||usedRegions.has(zone)||fixed[r]>=0&&fixed[r]!==c||notAllowed.has(r*n+c)||r>0&&Math.abs(positions[r-1]-c)<=1)continue;positions.push(c);usedCols.add(c);usedRegions.add(zone);visit(r+1);usedCols.delete(c);usedRegions.delete(zone);positions.pop()}}visit(0);return{count,first}}
function createPuzzle(lv){const n=lv<=4?4:lv<=9?5:lv<=15?6:7,rng=randFactory(lv*104729+291);let sol=null,regions=null;for(let tries=0;tries<3000;tries++){let candidate=shuffle(Array.from({length:n},(_,i)=>i),rng);if(candidate.some((c,r)=>r>0&&Math.abs(c-candidate[r-1])<=1))continue;const zone=new Array(n*n);for(let r=0;r<n;r++)for(let c=0;c<n;c++){let closest=0,d=1e10;for(let i=0;i<n;i++){const dist=Math.abs(r-i)*1.15+Math.abs(c-candidate[i])+.06*rng();if(dist<d){d=dist;closest=i}}zone[r*n+c]=closest}if(new Set(zone).size!==n)continue;sol=candidate;regions=zone;break}if(!sol)throw new Error('퍼즐 생성 오류');const fixed=Array(n).fill(-1),blocked=new Set();let givenCount=lv<=2?Math.max(1,n-2):lv<=5?1:0;const order=shuffle(Array.from({length:n},(_,i)=>i),rng);for(let i=0;i<givenCount;i++)fixed[order[i]]=sol[order[i]];let tries=0;while(solutions(n,regions,fixed,blocked).count!==1&&tries++<n*n){const alternatives=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(c!==sol[r]&&!blocked.has(r*n+c)&&fixed[r]<0)alternatives.push(r*n+c);shuffle(alternatives,rng);let chosen=null;for(const idx of alternatives){const t=new Set(blocked);t.add(idx);if(solutions(n,regions,fixed,t).count<solutions(n,regions,fixed,blocked).count){chosen=idx;break}}if(chosen===null){let row=order.find(r=>fixed[r]<0);if(row===undefined)break;fixed[row]=sol[row]}else blocked.add(chosen)}return{n,sol,regions,fixed,blocked};}
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function load(lv){level=lv;game=createPuzzle(lv);marks=Array(game.n*game.n).fill(0);for(const idx of game.blocked)marks[idx]=1;for(let r=0;r<game.n;r++)if(game.fixed[r]>=0)marks[r*game.n+game.fixed[r]]=2;ticks=0;win=false;$('message').textContent='규칙대로 동물을 배치해보세요!';clearInterval(clockHandle);clockHandle=setInterval(()=>{if(!win){ticks++;$('clock').textContent=fmt(ticks)}},1000);render()}
function tap(idx){if(win)return;const n=game.n,r=Math.floor(idx/n);if(game.fixed[r]===idx%n&&marks[idx]===2)return;const prev=marks[idx];marks[idx]=mode==='x'?(prev===1?0:1):(prev===2?0:2);if(marks[idx]===2){const c=idx%n;for(let i=0;i<n*n;i++)if(i!==idx&&marks[i]===2&&game.fixed[Math.floor(i/n)]<0&&(Math.floor(i/n)===r||i%n===c||game.regions[i]===game.regions[idx]))marks[i]=0}check();render()}
function check(){const n=game.n,chosen=[];for(let i=0;i<n*n;i++)if(marks[i]===2)chosen.push(i);if(chosen.length<n){$('message').textContent='좋아요! 조금만 더 찾아봐요.';return}const valid=chosen.length===n&&new Set(chosen.map(x=>Math.floor(x/n))).size===n&&new Set(chosen.map(x=>x%n)).size===n&&new Set(chosen.map(x=>game.regions[x])).size===n&&chosen.every((x,i)=>chosen.slice(i+1).every(y=>Math.abs(Math.floor(x/n)-Math.floor(y/n))>1||Math.abs(x%n-y%n)>1));if(valid){win=true;completed.add(level);$('message').textContent='🎉 성공! '+fmt(ticks)+'에 완성했어요!'}else $('message').textContent='아직 규칙에 맞지 않아요. 다시 확인해요.'}
function hint(){if(win)return;const n=game.n;for(let r=0;r<n;r++){let idx=r*n+game.sol[r];if(marks[idx]!==2){marks[idx]=2;check();render();$('message').textContent=win?'🎉 힌트로 완성했어요!':'💡 한 칸을 알려줬어요!';return}}$('message').textContent='모든 동물을 찾았어요!'}
function resetBoard(){load(level)}function nextLevel(){if(!win){$('message').textContent='현재 단계를 먼저 해결해주세요!';return}if(level<20)load(level+1);else $('message').textContent='🎉 20단계 모두 완료!'}
function render(){const n=game.n;const board=$('board');board.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;board.replaceChildren();for(let i=0;i<n*n;i++){const el=document.createElement('button');el.className='cell'+(marks[i]===2?' marked':'')+(game.fixed[Math.floor(i/n)]===i%n?' locked':'');el.style.background=colors[game.regions[i]%colors.length];el.textContent=marks[i]===1?'✕':marks[i]===2?icons[game.regions[i]%icons.length]:'';el.setAttribute('aria-label',`${Math.floor(i/n)+1}행 ${i%n+1}열, ${marks[i]===1?'제외':marks[i]===2?'동물':'빈칸'}`);el.onclick=()=>tap(i);board.append(el)}$('xMode').classList.toggle('active',mode==='x');$('aMode').classList.toggle('active',mode==='animal');$('levelTxt').textContent=`레벨 ${level} / 20`;$('clock').textContent=fmt(ticks);$('progressTxt').textContent=`★ ${completed.size}/20`;const container=$('levels');container.replaceChildren();for(let l=1;l<=20;l++){const b=document.createElement('button');b.textContent=l;b.className=(completed.has(l)?'done ':'')+(level===l?'current':'');b.onclick=()=>load(l);container.append(b)}}
load(1);
</script></body></html>
