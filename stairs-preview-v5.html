<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEON STAIRS · 캐릭터 업그레이드</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a2b}iframe{display:block;border:0;width:100%;height:100%;}</style><iframe id="game" src="./stairs-legacy.html?v=6" title="NEON STAIRS"></iframe><script>
const frame=document.getElementById("game");
frame.addEventListener("load",()=>{
 const w=frame.contentWindow;
 const runner=function(c,x,y,scale,facing,phase,config){
  const run=phase>=0, f=run?Math.floor(phase)%8:0;
  const leg=[[-7,5],[-5,3],[-2,0],[3,-4],[7,-6],[4,-3],[0,1],[-4,4]][f];
  const arm=run?[5,3,0,-4,-6,-3,0,4][f]:0;
  const skins={
   azure:["#9bd8f7","#b987ed","#377ed1","#174c91","#f3c65d"],
   luna:["#f1a6d7","#ae77ee","#a14dba","#573d8e","#ffdb83"],
   prince:["#f6d481","#b98a46","#416dc2","#243c83","#ffe69c"],
   princess:["#f5a9c7","#c77ca9","#bd5f9e","#743c7d","#ffe3a0"]
  };
  const p=skins[config.character]||skins.azure, ink="#25223b",skin="#f0b78f";
  const hair=p[0],shadow=p[1],coat=config.outfit==="sport"?"#53bcb0":config.outfit==="space"?"#c5d7e6":p[2],dark=config.outfit==="space"?"#667a9c":p[3],gold=p[4];
  c.save();c.translate(Math.round(x),Math.round(y));c.scale(facing*scale,scale);c.imageSmoothingEnabled=false;
  const q=(color,a,b,ww,hh)=>{c.fillStyle=color;c.fillRect(Math.round(a),Math.round(b),ww,hh)};
  const stroke=(color,points,width)=>{c.lineCap="square";c.lineJoin="miter";c.lineWidth=width+2;c.strokeStyle=ink;c.beginPath();c.moveTo(...points[0]);points.slice(1).forEach(t=>c.lineTo(...t));c.stroke();c.lineWidth=width;c.strokeStyle=color;c.stroke()};
  const bob=run?[0,-1,-2,-1,0,-1,-2,-1][f]:0;c.translate(0,bob);
  if(config.wings){q("#332d57",-17,-31,11,17);q("#bce4ff",-20,-35,11,15);q("#f5f7ff",-19,-34,5,8)}
  // Hair ribbon, layered ponytail and animated scarf
  q(ink,-15,-43,11,17);q(shadow,-14,-42,9,16);q(hair,-13,-42,6,13);
  q(ink,-18,-30+(run?arm/3:0),15,5);q(gold,-17,-29+(run?arm/3:0),12,3);
  // Back leg and arm
  stroke(dark,[[-3,-19],[leg[1],-11],[leg[1]-3,-3]],4);
  q(ink,leg[1]-7,-4,11,4);q("#eff7ff",leg[1]-6,-3,8,2);
  stroke(coat,[[-4,-31],[-9-arm,-24],[-6-arm,-19]],4);q(skin,-8-arm,-20,4,4);
  // Jacket with gold buttons and highlights
  q(ink,-8,-34,17,18);q(dark,-7,-33,15,16);q(coat,-5,-32,12,15);
  q("#b9e8f8",-5,-31,3,10);q(gold,3,-29,2,2);q(gold,3,-24,2,2);q(gold,3,-19,2,2);
  q(ink,-6,-18,13,3);q(gold,0,-18,3,2);
  // Larger but mature anime-pixel face and swept two-tone hair
  q(ink,-9,-49,18,17);q(shadow,-8,-48,16,15);
  q(skin,-5,-41,15,10);q("#ffd4ab",0,-40,9,6);
  q(ink,7,-38,3,3);q("#2b966f",7,-38,2,2);q("#fff",8,-38,1,1);
  q("#d37c72",7,-33,3,1);q(skin,10,-36,2,2);
  q(hair,-9,-49,17,7);q("#e8faff",-6,-48,8,2);q(hair,-10,-46,7,10);
  q(shadow,-7,-44,7,3);q(hair,0,-46,8,5);q("#e9faff",2,-45,5,2);
  q(hair,-11,-41,5,8);q(shadow,-10,-35,4,4);
  if(config.character==="luna"||config.character==="princess"){q(shadow,-12,-38,5,13);q(hair,-11,-37,3,10)}
  // Foreground leg, distinct eight-frame sprint
  stroke(dark,[[3,-17],[leg[0],-10],[leg[0]+(run?3:-1),-2]],4);
  q(ink,leg[0]-3,-4,12,4);q(config.shoes?"#76ffdf":"#f1f7ff",leg[0]-2,-3,10,2);
  stroke(coat,[[6,-31],[9+arm,-25],[11+arm,-29]],4);q(skin,10+arm,-31,4,4);
  if(config.crown||config.character==="prince"||config.character==="princess"){q(ink,-7,-52,16,5);q(gold,-6,-52,14,4);for(const a of [-5,0,5])q("#fff0aa",a,-56,3,5);q("#e35482",1,-51,2,2)}
  if(run){q("#e9d9fa", -12,-2,3,2)}
  c.restore();
 };
 w.drawRunner=runner;
 try{w.drawPreviews();}catch(e){}
});
</script></html>
