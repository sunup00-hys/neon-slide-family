    originalStair(x,y,index);
    const color={gold:"#ffe079",lava:"#ed6d48",rainbow:["#f77bb4","#8cddff","#a6e985","#e4b2ff"][index%4]}[shopData.step];
    if(color){game.eval("ctx").fillStyle=color;game.eval("ctx").fillRect(Math.round(x-25),Math.round(y),50,4);game.eval("ctx").fillStyle="#ffffff88";game.eval("ctx").fillRect(Math.round(x-21),Math.round(y+5),32,2)}
  };
  game.document.querySelectorAll("[data-character]").forEach(b=>b.addEventListener("click",()=>{const h=heroes.find(v=>v[4]===b.dataset.character);if(h&&shopData.owned.includes(h[0])){shopData.hero=h[0];saveShop()}else{shop.classList.add("open");tab="hero";refreshShop()}},true));
  game.drawPreviews();
 }catch(e){console.warn("Shop integration:",e)}
}
frame.addEventListener("load",()=>setTimeout(attachShop,100));
</script></html>
